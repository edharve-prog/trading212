[project]
name = "t212bot"
version = "0.1.0"
description = "Swing-trading bot for the Trading212 API with indicator screening and Claude-assisted ranking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "yfinance>=0.2.50",
]

[project.scripts]
t212bot = "t212bot.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t212bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["t212bot"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true

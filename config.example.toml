# Copy to config.toml and adjust. config.toml is git-ignored.

[broker]
# "demo" (practice account) or "live". Live order placement also needs allow_live = true.
environment = "demo"
allow_live = false
# When true, order calls are logged and not sent.
dry_run = true

[paths]
data_dir = "data"
state_dir = "state"

[data]
# "alpaca" (needs ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY in .env) or "yfinance".
provider = "alpaca"
# "sip" = all US exchanges (free plan: data at least 15 minutes old), "iex" = IEX only.
alpaca_feed = "sip"

[llm]
# OpenAI OAuth uses "Sign in with ChatGPT" and does not require an OpenAI API key.
# "openai_oauth" is the only provider implemented so far.
provider = "openai_oauth"
# Leave blank to discover the signed-in account's available models at runtime.
model = ""
# OAuth credentials live outside the repo with owner-only permissions on Unix.
openai_credential_path = "~/.config/t212bot/openai_oauth.json"
# Fixed loopback port makes SSH port-forwarding to a Raspberry Pi predictable.
openai_callback_port = 1455

[universe]
# Data-provider symbols (Yahoo style). Trading212 tickers are mapped separately.
symbols = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "JPM", "XOM", "UNH", "COST"]
benchmark = "SPY"
history_start = "2010-01-01"

[risk]
# Used from phase 2 onwards; listed here so the limits live in one place.
sleeve_fraction = 0.20
risk_per_trade = 0.005
max_position_fraction = 0.25
max_open_positions = 5
daily_loss_cap = 0.02
drawdown_kill = 0.10
